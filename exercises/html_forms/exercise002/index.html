<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Formulário</h1>
        <h2>Faça login em sua conta</h2>
    </header>
    <main>
        <section>
            <form action="" method="post" autocomplete="on">
                <fieldset>
                    <legend>Dados pessoais</legend>
                    <div>
                        <label for="inome">Nome de usuário: </label>
                        <input type="text" name="nome" id="inome" required minlength="3" maxlength="40" size="40" autocomplete="name">
                    </div>
                    <div>
                        <label for="iemail">Email de usuário: </label>
                        <input type="email" name="email" id="iemail" required minlength="15" size="40" maxlength="40" autocomplete="email">
                    </div>
                    <div>
                        <label for="isenha">Senha: </label>
                        <input type="password" name="senha" id="isenha" required minlength="8" maxlength="40" size="40" autocomplete="current-password">
                    </div>
                    <div>
                        <input type="radio" name="sexo" value="indefinido" id="indef" checked>
                        <label for="indef">Não quer informar</label>
                        <input type="radio" name="sexo" value="masculino" id="masc">
                        <label for="masc">Masculino</label>
                        <input type="radio" name="sexo" id="fem" value="feminino">
                        <label for="fem">Feminino</label>
                    </div>
                    <div id="buttons-area">
                        <button type="reset">Deletar</button>
                        <button type="submit">Entrar</button>
                    </div>
                </fieldset>
            </form>
        </section>
    </main>
</body>
</html>
