<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Olá! Seja bem-vindo(a)</h1>
        <h2>Faça login</h2>
    </header>
    <main>
        <section>
            <form action="" method="post" autocomplete="on">
                <div>
                    <label for="inome">Nome: </label>
                    <input type="text" name="usuario" id="inome" required minlength="3" maxlength="70" autocomplete="name">
                </div>
                <div>
                    <label for="iemail">Email: </label>
                    <input type="email" name="email" id="iemail" required minlength="10" maxlength="40" autocomplete="email">
                </div>
                <div>
                    <label for="isenha">Senha: </label>
                    <input type="password" name="senha" id="isenha" required minlength="8" maxlength="24" autocomplete="new-password">
                </div>
                <span>
                    <a href="#">Esqueci a senha</a>
                </span>
                <div id="btn">
                    <button type="reset">Deletar</button>
                    <button type="submit">Enviar</button>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
