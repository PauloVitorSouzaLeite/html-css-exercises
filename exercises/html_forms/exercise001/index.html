<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Formulário</h1>
        <h2>Cadastre-se já!</h2>
    </header>
    <main>
        <section>
            <form action="" method="get" autocomplete="on">
                <div>
                    <label for="inome">Seu nome: </label>
                    <input type="text" name="Nome" id="inome" autocomplete="name" required maxlength="40" minlength="5" size="40">                
                </div>
                <div>
                    <label for="iemail">Seu email: </label>
                    <input type="email" name="Email" id="iemail" autocomplete="email" required maxlength="29" size="40">
                </div>
                <div>
                    <label for="iseletor">Assunto desejado: </label>
                    <select name="opcoes" id="iseletor" required>
                        <option value="" disabled selected>Selecione uma opção</option>
                        <option value="Futebol">Futebol</option>
                        <option value="Basquetebol">Basquetebol</option>
                        <option value="Vôleibol">Vôleibol</option>
                        <option value="Natação">Natação</option>
                    </select>
                </div>
                <div>
                    <label for="imensagem">Deixe sua mensagem (opcional): </label>
                    <textarea name="texto" id="imensagem" rows="5" cols="50" maxlength="70"></textarea>
                </div>
                <div>
                    <button type="reset" id="delet" class="set">Deletar formulário</button>
                    <button type="submit" id="envio" class="set">Enviar formulário</button>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
