<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            display: flex;
            flex-flow: row nowrap;
            justify-content: space-evenly;
        }
        .item {
            flex-basis: 200px;
            border: 2px solid black;
            text-align: center;
            font-size: 1.3rem;
            color: white;
            background-color: darkred;
        }
        #b1 {
            flex-grow: 1;
            flex-shrink: 1;
        }
        #b2 {
            flex-grow: 0;
            flex-shrink: 0;
        }
        #b3 {
            flex-grow: 2;
            flex-shrink: 2;
        }
    </style>
</head>
<body>
    <main class="container">
        <div id="b1" class="item">Bloco 1</div>
        <div id="b2" class="item">Bloco 2</div>
        <div id="b3" class="item">Bloco 3</div>
    </main>
</body>
</html>
