<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2° Exercício</title>
    <style>
        .container {
            height: 50vh;
            display: flex;
            flex-flow: row wrap;
            justify-content: space-between;
            align-items: flex-end;
        }
        .item {
            border: 2px solid black;
            color: white;
        }
        #div1 {background-color: red ; height: 50px;}
        #div2 {background-color: darkblue; height: 70px;}
        #div3 {background-color: green; height: 30px;}
    </style>
</head>
<body>
    <main>
        <section class="container">
            <div class="item" id="div1">Bloco 1</div>
            <div class="item" id="div2">Bloco 2</div>
            <div class="item" id="div3">Bloco 3</div>
        </section>
    </main>
</body>
</html>
