<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css" media="all">
    <link rel="stylesheet" href="estilos/style.css">
    <title>Document</title>
</head>
<body>

        <section class="container">
            <div class="item">
                <img class="imagem" src="imagens/smartphone.jpg" alt="smarthphone moderno">

                <p class="price">1.499,99</>

            </div>
            <div class="item">

                <p class="price">1.199,99</>

                <p class="price">3.799,99</p>

            <div class="item">
                <img class="imagem" src="imagens/controle.jpg" alt="">

                <p class="price">1.699,99</p>
