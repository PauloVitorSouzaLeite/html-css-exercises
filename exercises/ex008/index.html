<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8° Exercício</title>
    <style>
        .container {
            height: 100vh;
            display: flex;
            flex-flow: row wrap;
            justify-content: space-evenly;
            align-items: center;
            align-content: flex-start;
            gap: 20px 15px;
        }
        .item {
            width: 150px; height: 150px;
            border: 1px solid black;
        }
        .item:nth-child(odd) {
            background-color: red;
        }
        .item:nth-child(even) {
            background-color: blue;
        }
    </style>
</head>
<body>
    <main class="container">
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
    </main>
</body>
</html>
