<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <main class="FlexContainer">
        <section class="GridContainer">
            <div class="GridItem Box">
                <input type="text" name="caixa" id="NumberBox">
            </div>
            <button class="GridItem One">1</button>
            <button class="GridItem Two">2</button>
            <button class="GridItem Three">3</button>
            <button class="GridItem Four">4</button>
            <button class="GridItem Five">5</button>
            <button class="GridItem Six">6</button>
            <button class="GridItem Seven">7</button>
            <button class="GridItem Eight">8</button>
            <button class="GridItem Nine">9</button>
            <button class="GridItem Zero">0</button>
            <button class="GridItem Delete">C</button>
            <button class="GridItem More">+</button>
            <button class="GridItem Less">-</button>
            <button class="GridItem Multiplication">*</button>
            <button class="GridItem Division">/</button>
            <button class="GridItem Same">=</button>
        </section>
    </main>
</body>
</html>
