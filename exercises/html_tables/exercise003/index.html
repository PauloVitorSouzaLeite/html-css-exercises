<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Tabela de horários</h1>
    </header>
    <main>
        <section>
            <table>
                <caption>
                    Tabela de horários
                </caption>
                <thead>
                    <tr>
                        <th scope="col">Dias</th>
                        <th scope="col">Manhã</th>
                        <th scope="col">Tarde</th>
                        <th scope="col">Noite</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <th scope="row">Segunda</th>
                        <td>Correr</td>
                        <td>Comer</td>
                        <td>Descanso</td>
                    </tr>
                    <tr>
                        <th scope="row">Terça</th>
                        <td>Navegar</td>
                        <td>Pedalar</td>
                        <td>Descanso</td>
                    </tr>
                    <tr>
                        <th scope="row">Quarta</th>
                        <td>Escalar</td>
                        <td>Dirigir</td>
                        <td>Descanso</td>
                    </tr>
                    <tr>
                        <th scope="row">Quinta</th>
                        <td>Correr</td>
                        <td>Pilotar</td>
                        <td>Descanso</td>
                    </tr>
                    <tr>
                        <th scope="row">Sexta</th>
                        <td>Pedalar</td>
                        <td>Escalar</td>
                        <td>Comer</td>
                    </tr>
                </tbody>
                <tfoot>
                    <tr>
                        <th scope="row">Fim de semana</th>
                        <td colspan="3">Livre</td>
                    </tr>
                </tfoot>
            </table>
        </section>
    </main>
</body>
</html>
